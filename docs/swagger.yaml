basePath: /
definitions:
  auth.meResponse:
    properties:
      id:
        type: integer
      phone:
        type: string
    type: object
  auth.phoneRequest:
    properties:
      phone:
        example: "77026207447"
        type: string
    type: object
  auth.tokenResponse:
    properties:
      access_token:
        type: string
    type: object
  auth.verifyRequest:
    properties:
      code:
        example: "123456"
        type: string
      phone:
        example: "77026207447"
        type: string
    type: object
  internal_handlers_admin_orders.getOrdersResp:
    properties:
      meta:
        properties:
          limit:
            type: integer
          page:
            type: integer
          total:
            type: integer
          total_pages:
            type: integer
        type: object
      orders:
        items:
          $ref: '#/definitions/internal_handlers_admin_orders.orderItem'
        type: array
    type: object
  internal_handlers_admin_orders.orderItem:
    properties:
      comment:
        type: string
      created_at:
        type: string
      id:
        type: integer
      location_address:
        type: string
      location_id:
        type: integer
      location_name:
        type: string
      status_id:
        type: integer
      status_name:
        type: string
      total_sum:
        type: string
    type: object
  internal_handlers_admin_orders.showOrderResp:
    properties:
      order:
        $ref: '#/definitions/internal_handlers_admin_orders.orderItem'
      order_products:
        description: nil если статус = черновик
        items:
          $ref: '#/definitions/orders.orderProductItem'
        type: array
      order_requests:
        description: всегда присутствует
        items:
          $ref: '#/definitions/orders.orderRequestItem'
        type: array
    type: object
  internal_handlers_orders.getOrdersResp:
    properties:
      meta:
        properties:
          limit:
            type: integer
          page:
            type: integer
          total:
            type: integer
          total_pages:
            type: integer
        type: object
      orders:
        items:
          $ref: '#/definitions/internal_handlers_orders.orderItem'
        type: array
    type: object
  internal_handlers_orders.orderItem:
    properties:
      comment:
        type: string
      created_at:
        type: string
      id:
        type: integer
      location_id:
        type: integer
      status_id:
        type: integer
      total_sum:
        type: string
    type: object
  internal_handlers_orders.showOrderResp:
    properties:
      comment:
        type: string
      created_at:
        type: string
      details_type:
        description: '"requests" | "products"'
        type: string
      id:
        type: integer
      location_id:
        type: integer
      products:
        items:
          $ref: '#/definitions/orders.productItem'
        type: array
      requests:
        items:
          $ref: '#/definitions/orders.requestItem'
        type: array
      status_id:
        type: integer
      total_sum:
        type: string
      user_id:
        type: integer
    type: object
  locations.locationCreateReq:
    properties:
      address:
        type: string
      name:
        type: string
    type: object
  locations.locationCreateResp:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  locations.locationUpdateReq:
    properties:
      address:
        type: string
      name:
        type: string
    type: object
  locations.locationUpdateResp:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  orders.cancelResp:
    properties:
      id:
        type: integer
      status_id:
        type: integer
    type: object
  orders.createReq:
    properties:
      comment:
        type: string
      location_id:
        type: integer
      requests:
        items:
          $ref: '#/definitions/orders.requestInp'
        type: array
    type: object
  orders.createResp:
    properties:
      comment:
        type: string
      created_at:
        type: string
      order_id:
        type: integer
      requests:
        items:
          $ref: '#/definitions/orders.requestResp'
        type: array
      status_id:
        type: integer
      total_sum:
        type: string
    type: object
  orders.orderProductItem:
    properties:
      available:
        type: boolean
      created_at:
        type: string
      id:
        type: integer
      order_id:
        type: integer
      price:
        type: integer
      price_cost:
        type: integer
      product_id:
        type: integer
      product_name:
        type: string
      quantity:
        type: string
      request_id:
        type: integer
      total_sum:
        type: integer
      total_sum_cost:
        type: integer
      unit:
        type: string
    type: object
  orders.orderRequestItem:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_available:
        type: boolean
      order_id:
        type: integer
      raw_amount:
        type: string
      raw_name:
        type: string
    type: object
  orders.orderStatusItem:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  orders.productItem:
    properties:
      available:
        type: boolean
      created_at:
        type: string
      id:
        type: integer
      price:
        type: string
      product_id:
        type: integer
      quantity:
        type: string
      request_id:
        type: integer
      total_sum:
        type: string
      unit:
        type: string
    type: object
  orders.requestDTO:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_available:
        type: boolean
      raw_amount:
        type: string
      raw_name:
        type: string
    type: object
  orders.requestInp:
    properties:
      raw_amount:
        type: string
      raw_name:
        type: string
    type: object
  orders.requestItem:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_available:
        type: boolean
      raw_amount:
        type: string
      raw_name:
        type: string
    type: object
  orders.requestResp:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_available:
        type: boolean
      raw_amount:
        type: string
      raw_name:
        type: string
    type: object
  orders.setProductItem:
    properties:
      available:
        description: optional, default true
        type: boolean
      price:
        description: required, >= 0
        type: integer
      price_cost:
        description: required, >= 0
        type: integer
      product_id:
        description: required
        type: integer
      quantity:
        description: 'required: "1.25" (max 2 decimals)'
        type: string
      request_id:
        description: optional
        type: integer
      unit:
        description: required
        type: string
    type: object
  orders.setProductsReq:
    properties:
      items:
        items:
          $ref: '#/definitions/orders.setProductItem'
        type: array
    type: object
  orders.updateReq:
    properties:
      comment:
        type: string
      location_id:
        type: integer
      requests:
        items:
          $ref: '#/definitions/orders.requestInp'
        type: array
    type: object
  orders.updateResp:
    properties:
      comment:
        type: string
      created_at:
        type: string
      id:
        type: integer
      location_id:
        type: integer
      requests:
        items:
          $ref: '#/definitions/orders.requestDTO'
        type: array
      status_id:
        type: integer
      total_sum:
        type: string
      user_id:
        type: integer
    type: object
  products.getProductsResp:
    properties:
      meta:
        properties:
          limit:
            type: integer
          page:
            type: integer
          total:
            type: integer
          total_pages:
            type: integer
        type: object
      products:
        items:
          $ref: '#/definitions/products.productItem'
        type: array
    type: object
  products.productCreateReq:
    properties:
      name:
        type: string
      product_aliases:
        items:
          type: string
        type: array
    type: object
  products.productItem:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      product_aliases:
        items:
          type: string
        type: array
    type: object
  products.productResp:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      product_aliases:
        items:
          type: string
        type: array
    type: object
  products.productUpdateReq:
    properties:
      name:
        type: string
      product_aliases:
        items:
          type: string
        type: array
    type: object
  userlocations.bindUserToLocationReq:
    properties:
      location_id:
        type: integer
      role_id:
        description: null => без роли / стереть
        type: integer
      user_id:
        type: integer
    type: object
  userlocations.myLocationItem:
    properties:
      address:
        type: string
      granted_at:
        type: string
      location_id:
        type: integer
      name:
        type: string
      role_id:
        type: integer
      role_name:
        type: string
    type: object
  userlocations.unbindUserFromLocationReq:
    properties:
      location_id:
        type: integer
      user_id:
        type: integer
    type: object
info:
  contact: {}
  description: Horeka backend
  title: Horeka API
  version: "1.0"
paths:
  /admin/orders:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает список заказов (админ), доступных пользователю по его локациям, с пагинацией.

        Поддерживает фильтры по location_id и status_id.
        location_id — только из локаций пользователя, иначе FORBIDDEN.
        status_id — должен существовать, иначе STATUS_NOT_FOUND.
      parameters:
      - description: Фильтр по локации (только доступные пользователю)
        in: query
        name: location_id
        type: integer
      - description: Фильтр по статусу
        in: query
        name: status_id
        type: integer
      - description: Номер страницы (по умолчанию 1)
        in: query
        name: page
        type: integer
      - description: Размер страницы (по умолчанию 10, максимум 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_admin_orders.getOrdersResp'
      summary: Список заказов
      tags:
      - admin
  /admin/orders/{id}:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает заказ по id, если он относится к одной из локаций текущего пользователя.

        Всегда возвращает список order_requests.
        Список order_products возвращается только если статус заказа не "draft".
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_admin_orders.showOrderResp'
      summary: Детали заказа
      tags:
      - admin
  /admin/orders/{id}/cancel:
    post:
      consumes:
      - application/json
      description: |-
        Отменяет заказ, если он принадлежит одной из локаций текущего пользователя.

        Доступ только для роли admin.
        При успешной отмене статус заказа изменяется на "отменён".
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Отмена заказа
      tags:
      - admin
  /admin/orders/{id}/products:
    put:
      consumes:
      - application/json
      description: |-
        Полностью заменяет список товаров заказа на переданный в запросе.

        Операция выполняется в транзакции: сначала удаляются все текущие позиции, затем вставляются новые.
        Если указан request_id — проверяется, что он принадлежит этому заказу.
        После обновления пересчитываются total_sum и total_sum_cost.
        Если текущий статус заказа "draft" — статус меняется на "assembled".
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: integer
      - description: Список товаров заказа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/orders.setProductsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Установить товары в заказе
      tags:
      - admin
  /admin/orders/statuses:
    get:
      consumes:
      - application/json
      description: Возвращает все доступные статусы заказов.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/orders.orderStatusItem'
            type: array
      summary: Список статусов заказов
      tags:
      - admin
  /auth/me:
    get:
      description: |-
        Возвращает информацию о пользователе, который выполняет запрос. Пользователь определяется по JWT-токену, переданному в заголовке Authorization.

        Этот метод не принимает входных параметров, потому что идентификатор пользователя извлекается сервером из токена доступа.
        Если токен отсутствует, недействителен или пользователь не найден в базе — будет возвращена ошибка авторизации.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.meResponse'
      security:
      - BearerAuth: []
      summary: Получить данные текущего авторизованного пользователя
      tags:
      - auth
  /auth/request-code:
    post:
      consumes:
      - application/json
      description: |-
        Создает и сохраняет новый SMS-код для указанного номера телефона.

        Перед генерацией новый код заменяет все предыдущие коды, ранее созданные для этого номера.
        Это сделано для того, чтобы одновременно был активен только один код подтверждения.

        Метод используется как первый шаг авторизации перед вызовом проверки кода.
      parameters:
      - description: Номер телефона пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.phoneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Запрос кода подтверждения для входа
      tags:
      - auth
  /auth/verify-code:
    post:
      consumes:
      - application/json
      description: |-
        Проверяет SMS-код, выданный ранее для номера телефона.

        Если код корректный и еще не использовался — он помечается использованным.
        После успешной проверки выполняется поиск пользователя по номеру.
        Если пользователь не существует — он создается автоматически.

        В случае успешной проверки возвращается JWT access token,
        который используется для авторизации во всех защищённых методах API.
      parameters:
      - description: Телефон и код подтверждения
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.verifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokenResponse'
      summary: Подтверждение кода и вход пользователя
      tags:
      - auth
  /locations:
    post:
      consumes:
      - application/json
      description: |-
        Создает новую локацию.
        Доступ только для роли admin.
      parameters:
      - description: Данные локации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/locations.locationCreateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/locations.locationCreateResp'
      summary: Создание локации
      tags:
      - locations
  /locations/{id}:
    delete:
      consumes:
      - application/json
      description: |-
        Удаляет локацию по ID.
        Доступ только для роли admin.
      parameters:
      - description: ID локации
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Удаление локации
      tags:
      - locations
    put:
      consumes:
      - application/json
      description: |-
        Обновляет название и адрес локации по ID.
        Доступ только для роли admin.
      parameters:
      - description: ID локации
        in: path
        name: id
        required: true
        type: integer
      - description: Данные локации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/locations.locationUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/locations.locationUpdateResp'
      summary: Обновление локации
      tags:
      - locations
  /orders:
    get:
      description: |-
        Возвращает заказы, относящиеся к указанной локации, отсортированные по дате создания (сначала новые).

        Требуется доступ пользователя к локации: пользователь должен быть привязан к location_id (user_locations).
        Если локация не существует — возвращается ошибка. Если доступа к локации нет — возвращается запрет.

        Параметры page и limit управляют пагинацией. limit ограничен максимумом 100.
        В ответе возвращается список заказов и мета-информация (page, limit, total, total_pages).
        Если заказов нет — возвращается пустой массив orders и meta.total = 0.
      parameters:
      - description: ID локации
        in: query
        name: location_id
        required: true
        type: integer
      - description: Страница (по умолчанию 1)
        in: query
        name: page
        type: integer
      - description: Лимит (по умолчанию 10, максимум 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_orders.getOrdersResp'
      security:
      - BearerAuth: []
      summary: Получить список заказов по локации с пагинацией
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: |-
        Создает заказ для текущего авторизованного пользователя в указанной локации.

        В теле запроса передается список позиций (requests) в свободной форме: raw_name и raw_amount.
        Сервер сохраняет эти позиции как заявки и создает заказ в начальном статусе "новый" (status_id = 1).

        comment — необязательный комментарий к заказу. Если передан пустым, в базе будет NULL и поле может отсутствовать в ответе.

        В ответе возвращается созданный заказ и список сохраненных заявок с их ID и временем создания.
      parameters:
      - description: Локация, комментарий (опц.), список заявок
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/orders.createReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orders.createResp'
      security:
      - BearerAuth: []
      summary: Создание нового заказа
      tags:
      - orders
  /orders/{id}:
    get:
      description: |-
        Возвращает один заказ текущего авторизованного пользователя.

        Заказ ищется только среди заказов пользователя (id + user_id). Чужие заказы не отдаются.
        Если заказ не найден — возвращается 404.

        Состав деталей зависит от статуса заказа:
        - если status_id = 1 (новый) — возвращаются заявки из order_requests, а поле details_type = "requests"
        - иначе — возвращаются товары из order_products, а поле details_type = "products"

        В ответе всегда присутствуют основные поля заказа (id, location_id, status_id, total_sum, comment, created_at)
        и один из списков: requests или products.
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_orders.showOrderResp'
      security:
      - BearerAuth: []
      summary: Получить детали заказа по ID
      tags:
      - orders
    put:
      consumes:
      - application/json
      description: |-
        Обновляет заказ текущего авторизованного пользователя по ID.

        Редактирование разрешено только для заказов в статусе "новый" (status_id = 1).
        Если статус уже изменился (в обработке/закрыт/отменен и т.п.) — возвращается конфликт и заказ не меняется.

        Обновляются поля location_id и comment (comment необязателен: пустая строка будет сохранена как NULL).

        Список заявок (requests) перезаписывается полностью:
        старые записи из order_requests удаляются и создаются новые на основе переданного массива.
        Это сделано, чтобы редактирование было простым и однозначным: итоговый список = то, что пришло в запросе.

        В ответе возвращается обновленный заказ и новый список заявок с их ID и временем создания.
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: integer
      - description: 'Новые данные заказа: location_id, comment (опц.), requests'
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/orders.updateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orders.updateResp'
      security:
      - BearerAuth: []
      summary: Редактировать заказ (только пока он новый)
      tags:
      - orders
  /orders/{id}/cancel:
    post:
      description: |-
        Отменяет заказ текущего пользователя по ID.

        Отменить можно только свой заказ и только в статусе "новый" (status_id = 1).
        Если заказ уже в обработке/завершен/в другом статусе — отмена запрещена.

        При успешной отмене статус заказа меняется на "отменен" (status_id = 4) и это значение возвращается в ответе.
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orders.cancelResp'
      security:
      - BearerAuth: []
      summary: Отмена заказа
      tags:
      - orders
  /products:
    get:
      consumes:
      - application/json
      description: Возвращает список продуктов с алиасами (админ), с пагинацией.
      parameters:
      - description: Номер страницы (по умолчанию 1)
        in: query
        name: page
        type: integer
      - description: Размер страницы (по умолчанию 10, максимум 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/products.getProductsResp'
      summary: Список продуктов
      tags:
      - products
    post:
      consumes:
      - application/json
      description: |-
        Создает новый продукт с алиасами.
        Доступ только для роли admin.
      parameters:
      - description: Данные продукта
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/products.productCreateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/products.productResp'
      summary: Создание продукта
      tags:
      - products
  /products/{id}:
    delete:
      consumes:
      - application/json
      description: |-
        Удаляет продукт по ID.
        Доступ только для роли admin.
      parameters:
      - description: ID продукта
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Удаление продукта
      tags:
      - products
    put:
      consumes:
      - application/json
      description: |-
        Обновляет название продукта и полностью заменяет список алиасов.
        Доступ только для роли admin.
      parameters:
      - description: ID продукта
        in: path
        name: id
        required: true
        type: integer
      - description: Данные продукта
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/products.productUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Обновление продукта
      tags:
      - products
  /products/search:
    get:
      consumes:
      - application/json
      description: |-
        Ищет продукты по названию и алиасам.

        Параметр q обязателен. Поиск регистронезависимый, поддерживает подстроку и fuzzy (similarity).
        Результаты ранжируются: сначала точное попадание подстрокой, затем по similarity.
      parameters:
      - description: Поисковый запрос
        in: query
        name: q
        required: true
        type: string
      - description: Номер страницы (по умолчанию 1)
        in: query
        name: page
        type: integer
      - description: Размер страницы (по умолчанию 10, максимум 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/products.getProductsResp'
      summary: Поиск продуктов
      tags:
      - products
  /user-locations/bind:
    post:
      consumes:
      - application/json
      description: |-
        Создает или обновляет привязку пользователя к локации.

        Если привязки user_id + location_id еще нет — она будет создана.
        Если привязка уже существует — будет обновлено только поле role_id.

        role_id — необязательное поле.
        - role_id = null: привязка остается, роль будет очищена (role_id станет NULL)
        - role_id > 0: роль будет установлена/заменена на указанную

        Метод проверяет существование пользователя, локации и (если передан) роли.
      parameters:
      - description: user_id, location_id, role_id (опц.)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/userlocations.bindUserToLocationReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Привязать пользователя к локации (назначить роль)
      tags:
      - user_locations
  /user-locations/me:
    get:
      description: |-
        Возвращает все локации, к которым текущий пользователь привязан (таблица user_locations).

        В ответе для каждой локации возвращаются:
        - location_id, name, address
        - role_id и role_name (могут быть null, если роль не назначена)
        - granted_at — дата/время, когда была выдана привязка к локации

        Список отсортирован по granted_at по убыванию (сначала самые последние привязки).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/userlocations.myLocationItem'
            type: array
      security:
      - BearerAuth: []
      summary: Получить список моих локаций
      tags:
      - user_locations
  /user-locations/unbind:
    post:
      consumes:
      - application/json
      description: |-
        Удаляет привязку пользователя к локации (запись из user_locations) по паре user_id + location_id.

        Если пользователя или локации не существует — возвращается 404.
        Если привязки user_id + location_id нет — возвращается 404 (bind not found).
        При успешном удалении возвращается 200 без тела.
      parameters:
      - description: user_id и location_id
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/userlocations.unbindUserFromLocationReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Отвязать пользователя от локации
      tags:
      - user_locations
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
